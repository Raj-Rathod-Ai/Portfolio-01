<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raj Rathod | AI & Machine Learning Engineer</title>
  <meta name="description" content="Portfolio of Raj Rathod, AI & Machine Learning Developer. Specializing in Deep Learning, NLP, Computer Vision, and Predictive Analytics.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  
  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkBg: '#0d1117',
            darkCard: 'rgba(22, 27, 34, 0.85)',
            primary: '#6366f1',
            secondary: '#8b5cf6',
            accent: '#f59e0b',
            rose: '#f43f5e',
            teal: '#14b8a6',
            sky: '#38bdf8',
          },
          fontFamily: {
            jakarta: ['Plus Jakarta Sans', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-gray-100 font-inter transition-colors duration-300">

  <!-- Scroll Progress Indicator -->
  <div id="scroll-progress"></div>

  <!-- Ambient Organic Aurora Blobs ("Human Design") -->
  <div class="aurora-blob blob-primary"></div>
  <div class="aurora-blob blob-secondary"></div>
  <div class="aurora-blob blob-accent"></div>

  <!-- Preloader Splash Screen -->
  <div id="preloader" class="fixed inset-0 z-[99999] flex flex-col items-center justify-center bg-darkBg select-none">
    <div class="flex flex-col items-center space-y-5">
      <!-- Minimalist Professional Spinner -->
      <div class="relative w-12 h-12">
        <div class="w-12 h-12 rounded-full border-2 border-white/5"></div>
        <div class="absolute inset-0 w-12 h-12 rounded-full border-2 border-primary border-t-transparent animate-spin"></div>
      </div>
      <div class="text-center space-y-1">
        <p class="font-jakarta text-[11px] font-semibold tracking-widest text-gray-400 uppercase">Raj Rathod</p>
        <p id="loader-perc" class="font-mono text-[10px] text-gray-500">0%</p>
      </div>
      <div class="w-28 h-[2px] bg-white/5 rounded-full overflow-hidden">
        <div id="loader-fill" class="h-full bg-primary w-0 transition-all duration-100 rounded-full"></div>
      </div>
    </div>
  </div>

  <!-- Interactive canvas backdrop -->
  <canvas id="neural-canvas" class="fixed inset-0 z-0 pointer-events-none opacity-20"></canvas>

  <!-- Mount points for navbar -->
  <div id="navbar-header-mount"></div>

  <!-- Main dynamic pages mount point -->
  <main class="relative z-10 pt-16" id="page-content">
    <!-- Pages render dynamically here -->
  </main>

  <!-- Mount point for footer -->
  <div id="footer-mount"></div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Main dynamic application modules entry point -->
  <script type="module" src="/src/app.js"></script>

</body>
</html>
